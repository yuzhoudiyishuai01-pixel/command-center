<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="指挥室">
  <defs>
    <!-- 底色：深空紫，上暗下亮，像从下方打上来的光 -->
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0421" />
      <stop offset="1" stop-color="#1a0a38" />
    </linearGradient>
    <!-- 六边形描边：粉 → 紫 → 青，和桌面图标同一套走色 -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2ea6" />
      <stop offset="0.52" stop-color="#a382ff" />
      <stop offset="1" stop-color="#22e9ff" />
    </linearGradient>
    <linearGradient id="bar-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7cc8" />
      <stop offset="1" stop-color="#ff2ea6" />
    </linearGradient>
    <linearGradient id="bar-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bf4ff" />
      <stop offset="1" stop-color="#22e9ff" />
    </linearGradient>
    <linearGradient id="bar-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3c4ff" />
      <stop offset="1" stop-color="#a382ff" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- 光晕必须裁在圆角里：否则氛围光会溢出到四个直角，
         小尺寸下整个图标就变成"方形底 + 圆角"的怪形状 -->
    <clipPath id="round">
      <rect width="64" height="64" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="64" height="64" rx="14" fill="url(#void)" />
    <!-- 氛围光：左上粉、右下青 -->
    <ellipse cx="12" cy="8" rx="30" ry="24" fill="#ff2ea6" opacity="0.22" />
    <ellipse cx="54" cy="58" rx="30" ry="24" fill="#22e9ff" opacity="0.18" />

    <g filter="url(#glow)">
      <!-- 霓虹六边形 -->
      <path d="M32 10.5 L50.6 21.2 L50.6 42.8 L32 53.5 L13.4 42.8 L13.4 21.2 Z"
            fill="none" stroke="url(#ring)" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- 三根均衡条：小尺寸下真正能认出来的是这三根发光条 -->
    <g filter="url(#glow)">
      <rect x="21.5" y="28.8" width="4.8" height="12.8" rx="2.4" fill="url(#bar-a)" />
      <rect x="28.6" y="22.4" width="4.8" height="19.2" rx="2.4" fill="url(#bar-b)" />
      <rect x="35.7" y="32" width="4.8" height="9.6" rx="2.4" fill="url(#bar-c)" />
    </g>

    <rect x="0.7" y="0.7" width="62.6" height="62.6" rx="13.4" fill="none"
          stroke="#ff2ea6" stroke-opacity="0.45" stroke-width="1.4" />
  </g>
</svg>
